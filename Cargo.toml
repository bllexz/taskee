[workspace]
members = ["taskee-derive"]

[package]
name = "taskee"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Typed, observable state for long-running async tasks. Built on tokio::sync::watch"
repository = "https://github.com/bllexz/taskee"
keywords = ["task", "progress", "async", "tokio"]
categories = ["asynchronous", "concurrency"]

[features]
default = ["derive", "rt"]
derive = ["dep:taskee-derive"]
rt = ["tokio/rt"]

[dependencies]
taskee-derive = { version = "0.1.0", path = "taskee-derive", optional = true }
tokio = { version = "1.53.1", default-features = false, features = [
  "sync",
  "macros",
] }

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "time",
] }

[package.metadata.docs.rs]
all-features = true
