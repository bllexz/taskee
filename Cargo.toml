[workspace]
members = ["taskee-derive"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.53.1", default-features = false }
proc-macro2 = { version = "1.0.106", default-features = false }
quote = "1.0.47"
syn = { version = "3.0.5", default-features = false }

[package]
name = "taskee"
version = "0.1.0"
edition = "2024"

[features]
default = ["derive", "rt"]
derive = ["dep:taskee-derive"]
rt = ["tokio/rt"]

[dependencies]
taskee-derive = { path = "taskee-derive", optional = true }
tokio = { workspace = true, features = ["sync", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
